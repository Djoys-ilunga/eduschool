{# Breadcrumbs Component - Accepte `breadcrumbs` = liste de (label, url) avec url=None pour le dernier #}
{% if breadcrumbs %}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item">
            <a href="{{ url_for('dashboard.index') }}" class="text-decoration-none">
                <i class="bi bi-house-door-fill"></i> Accueil
            </a>
        </li>
        {% for label, url in breadcrumbs %}
            {% if url %}
                <li class="breadcrumb-item">
                    <a href="{{ url }}" class="text-decoration-none">{{ label }}</a>
                </li>
            {% else %}
                <li class="breadcrumb-item active" aria-current="page">{{ label }}</li>
            {% endif %}
        {% endfor %}
    </ol>
</nav>
{% endif %}
